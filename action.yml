name: wavedash-action
description: Upload and publish your game files to Wavedash
author: remarkablemark

inputs:
  token:
    description: Wavedash API token
    required: true

  config:
    description: Path to wavedash.toml
    required: false
    default: ./wavedash.toml

  game-id:
    description: Game ID used to create wavedash.toml when it is missing
    required: false

  upload-dir:
    description: Upload directory used when creating wavedash.toml
    required: false
    default: ./dist

  entrypoint:
    description: Entrypoint for wavedash.toml and SDK injection
    required: false
    default: index.html

  sdk-version:
    description: Wavedash SDK version to inject into the entrypoint HTML
    required: false
    default: 1.3.40

  publish:
    description: Whether to publish the uploaded build
    required: false
    default: "false"

  version:
    description: Build version or message passed to wavedash build push
    required: false
    default: 1.2.3

  title:
    description: Release title passed to wavedash publish
    required: false

  summary:
    description: Release summary passed to wavedash publish
    required: false

  added:
    description: Added changelog items passed to wavedash publish (one per line)
    required: false

  removed:
    description: Removed changelog items for wavedash publish (one per line)
    required: false

  fixed:
    description: Fixed changelog items for wavedash publish (one per line)
    required: false

  adjusted:
    description: Adjusted changelog items for wavedash publish (one per line)
    required: false

outputs:
  build-id:
    description: Build ID returned by wavedash build push
    value: ${{ steps.upload.outputs.build-id }}

  playtest-url:
    description: Playtest URL returned by wavedash build push
    value: ${{ steps.upload.outputs.playtest-url }}

  published:
    description: Whether the build was published
    value: ${{ steps.publish.outputs.published }}

runs:
  using: composite
  steps:
    - name: Install Wavedash CLI
      shell: bash
      run: |
        if ! command -v wavedash >/dev/null 2>&1; then
          curl -fsSL https://wavedash.com/cli/install.sh | sh
          for dir in \
            "$HOME/.wavedash/bin" \
            "$HOME/.local/bin" \
            "$HOME/.cargo/bin"; do
              [ -d "$dir" ] && PATH="$dir:$PATH"
          done
          export PATH
        fi
        wavedash --version
      env:
        WAVEDASH_TOKEN: ${{ inputs.token }}

    - name: Create wavedash.toml
      shell: bash
      run: |
        if [ ! -f "$CONFIG" ] && [ -n "$GAME_ID" ]; then
          mkdir -p "$(dirname "$CONFIG")"
          cat > "$CONFIG" << EOF
        game_id = "$GAME_ID"
        upload_dir = "$UPLOAD_DIR"
        entrypoint = "$ENTRYPOINT"
        EOF
        fi
      env:
        CONFIG: ${{ inputs.config }}
        GAME_ID: ${{ inputs.game-id }}
        UPLOAD_DIR: ${{ inputs.upload-dir }}
        ENTRYPOINT: ${{ inputs.entrypoint }}

    - name: Inject Wavedash SDK
      shell: bash
      run: |
        if [ ! -f "$CONFIG" ] || [ -z "$GAME_ID" ]; then
          exit 0
        fi

        ENTRYPOINT_FILE="$UPLOAD_DIR/$ENTRYPOINT"
        if [ ! -f "$ENTRYPOINT_FILE" ]; then
          exit 0
        fi

        if grep -q "@wvdsh/sdk-js" "$ENTRYPOINT_FILE"; then
          exit 0
        fi

        python3 "$GITHUB_ACTION_PATH/scripts/inject-wavedash-sdk.py" \
          "$ENTRYPOINT_FILE" "$SDK_VERSION"
      env:
        CONFIG: ${{ inputs.config }}
        GAME_ID: ${{ inputs.game-id }}
        UPLOAD_DIR: ${{ inputs.upload-dir }}
        ENTRYPOINT: ${{ inputs.entrypoint }}
        SDK_VERSION: ${{ inputs.sdk-version }}

    - name: Upload build
      id: upload
      shell: bash
      run: |
        for dir in \
          "$HOME/.wavedash/bin" \
          "$HOME/.local/bin" \
          "$HOME/.cargo/bin"; do
            [ -d "$dir" ] && PATH="$dir:$PATH"
        done
        export PATH

        OUTPUT=$(wavedash build push --config "$CONFIG" -m "$VERSION" 2>&1)
        echo "$OUTPUT"

        BUILD_ID=$(echo "$OUTPUT" | \
          sed -n 's/.*Build ID: //p' | tr -d '[:space:]')
        PLAYTEST_URL=$(echo "$OUTPUT" | \
          sed -n 's/.*Play at: //p' | tr -d '[:space:]')

        if [ -z "$BUILD_ID" ]; then
          echo "Failed to extract Build ID from wavedash build push output" >&2
          exit 1
        fi

        echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
        echo "playtest-url=$PLAYTEST_URL" >> "$GITHUB_OUTPUT"
      env:
        CONFIG: ${{ inputs.config }}
        VERSION: ${{ inputs.version }}
        WAVEDASH_TOKEN: ${{ inputs.token }}

    - name: Publish build
      id: publish
      shell: bash
      run: |
        if [ "$PUBLISH" != "true" ]; then
          echo "published=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        for dir in \
          "$HOME/.wavedash/bin" \
          "$HOME/.local/bin" \
          "$HOME/.cargo/bin"; do
            [ -d "$dir" ] && PATH="$dir:$PATH"
        done
        export PATH

        ARGS=()
        [ -n "$TITLE" ] && ARGS+=(--title "$TITLE")
        [ -n "$SUMMARY" ] && ARGS+=(--summary "$SUMMARY")

        while IFS= read -r line; do
          [ -n "$line" ] && ARGS+=(--added "$line")
        done <<< "$ADDED"

        while IFS= read -r line; do
          [ -n "$line" ] && ARGS+=(--removed "$line")
        done <<< "$REMOVED"

        while IFS= read -r line; do
          [ -n "$line" ] && ARGS+=(--fixed "$line")
        done <<< "$FIXED"

        while IFS= read -r line; do
          [ -n "$line" ] && ARGS+=(--adjusted "$line")
        done <<< "$ADJUSTED"

        wavedash publish "$BUILD_ID" --config "$CONFIG" "${ARGS[@]}"
        echo "published=true" >> "$GITHUB_OUTPUT"
      env:
        CONFIG: ${{ inputs.config }}
        PUBLISH: ${{ inputs.publish }}
        TITLE: ${{ inputs.title }}
        SUMMARY: ${{ inputs.summary }}
        ADDED: ${{ inputs.added }}
        REMOVED: ${{ inputs.removed }}
        FIXED: ${{ inputs.fixed }}
        ADJUSTED: ${{ inputs.adjusted }}
        BUILD_ID: ${{ steps.upload.outputs.build-id }}
        WAVEDASH_TOKEN: ${{ inputs.token }}

branding:
  icon: activity
  color: white
