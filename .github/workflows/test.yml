name: test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run action
        if: >-
          ${{
            secrets.WAVEDASH_TOKEN != '' &&
            secrets.WAVEDASH_GAME_ID != ''
          }}
        id: wavedash
        uses: ./
        with:
          token: ${{ secrets.WAVEDASH_TOKEN }}
          game-id: ${{ secrets.WAVEDASH_GAME_ID }}
          upload-dir: ./test/dist
          entrypoint: index.html

      - name: Verify build-id output
        if: ${{ steps.wavedash.outputs.build-id != '' }}
        shell: bash
        run: |
          echo "build-id: ${{ steps.wavedash.outputs.build-id }}"
          echo "playtest-url: ${{ steps.wavedash.outputs.playtest-url }}"
