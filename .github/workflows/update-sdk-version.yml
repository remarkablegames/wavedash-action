name: update-sdk-version
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update SDK version
        id: update
        run: ./scripts/update-sdk-version.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: >-
            chore(deps): bump @wvdsh/sdk-js to
            ${{ steps.update.outputs.version }}
          title: >-
            chore(deps): bump @wvdsh/sdk-js to
            ${{ steps.update.outputs.version }}
          body: |
            Bump the default Wavedash SDK version to the latest release.
          branch: chore/bump-wavedash-sdk
          delete-branch: true
